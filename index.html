<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Landing Page</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header section  -->
    <header class="header">
      <nav>
        <div class="logo">
          <img src="/assets/logo.png" />
        </div>

        <div class="nav-links">
          <a href="#">Pricing</a>
          <a href="#">Platform <img src="assets/dropdown.png" /></a>
          <a href="#">Solutions <img src="assets/dropdown.png" /></a>
          <a href="#">Resources <img src="assets/dropdown.png" /></a>
        </div>
        <button href="#" class="nav-btn">Get a Demo</button>
      </nav>
    </header>
    <!-- hero section  -->
    <div class="hero">
      <div class="hero-sec">
        <h1>A full customer service team, <br />powered by AI</h1>

        <p>
          Don't settle for a basic chatbot - your customers deserve <br />
          better. Get a fully stocked, AI-powered customer service automation
          platform that <br />
          resolves more inquiries with the least amount of effort.
        </p>
        <div class="hero-btn">
          <button href="#" class="see-ada">See Ada in Action</button>
          <button href="#" class="learn-more">Learn More</button>
        </div>
        <div class="hero-img">
          <img src="assets/hero-img.png" alt="hero image" />
        </div>
      </div>
    </div>
  </body>
</html>
