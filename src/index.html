<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Landing Page</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="bg-[#0B0F19]">
      <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between h-20">
          <!-- Logo Image -->
          <div class="flex items-center">
            <img
              src="assets/Logo.png"
              alt="Ada Logo"
              class="h-8 w-auto object-contain"
            />
          </div>

          <!-- Nav Links -->
          <nav class="hidden md:flex items-center space-x-10">
            <a href="#" class="text-gray-300 hover:text-white transition">
              Pricing
            </a>

            <div
              class="flex items-center space-x-1 cursor-pointer text-gray-300 hover:text-white transition"
            >
              <span>Platform</span>
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>

            <div
              class="flex items-center space-x-1 cursor-pointer text-gray-300 hover:text-white transition"
            >
              <span>Solutions</span>
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>

            <div
              class="flex items-center space-x-1 cursor-pointer text-gray-300 hover:text-white transition"
            >
              <span>Resources</span>
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
          </nav>

          <!-- CTA Button -->
          <div>
            <a
              href="#"
              class="px-6 py-3 rounded-xl text-white font-semibold bg-gradient-to-b from-[#9977D4] to-[#6337AE] shadow-lg hover:opacity-90 transition"
            >
              Get a Demo
            </a>
          </div>
        </div>
      </div>
    </header>

    <hero class="flex justify-center bg-[#1B1E23] h-[1323px]">
      <div class="mt-[100px] h-[243px]  p-[20px]">
        <h1 class="flex justify-center text-[56px] text-white">
          A full customer service team, powered by AI
        </h1>
        <p class="flex justify-center text-[20px] text-white align-middle mt-[24px]">
          Don't settle for a basic chatbot - your customers deserve better. Get
          a fully stocked, AI-powered customer serviceautomation platform that
          resolves more inquiries with the least amount of effort.
        </p>
        <button>
            
        </button>
        <img src="assets/hero-img.png" class="justify-center" />
      </div>
      </div>
    </hero>
  </body>
</html>
